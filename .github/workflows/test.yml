name: Verify native mods
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install official pinned native test host
        run: npm install --global @anthropic-ai/claude-code@2.1.311
      - run: claude --version
      - run: npm run check
      - run: npm test
      - run: npm run test:git
      - run: npm run test:install
